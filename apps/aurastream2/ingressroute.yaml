# The console's own hostname, served at the ROOT.
#
# Until 2026-09-09 v2 also answered on v1's hostname under a /aurastream2 PathPrefix, with a
# StripPrefix middleware, because the web image was built with VITE_BASE_PATH=/aurastream2/ and
# Buffer held media URLs on that base. Both are now gone: the image is built with
# VITE_BASE_PATH=/, and every media link minted against the old base has expired on its own —
# PublicMediaLink protects each token with TimeSpan.FromHours(24), so no link outlives a day
# whatever the routing says. v1 (apps/aurastream) is untouched and owns its hostname alone again.
#
# Three things must agree, or the console breaks in ways that look unrelated: what Traefik
# serves (here), the SPA's asset base (CI repo var VITE_BASE_PATH), and the router basename
# (read from the same build via import.meta.env.BASE_URL). All three are now "/".
#
# `spec.tls` is per-object, which is why this host has its own IngressRoute and its own
# certificate rather than another route on a shared one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aurastream2-stocznia
  namespace: aurastream2
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`aurastream.stocznia.dev`)
      kind: Rule
      priority: 100
      services:
        - name: aurastream2-web
          port: 80
  tls:
    secretName: aurastream2-stocznia-tls
