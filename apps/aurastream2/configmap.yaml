# Non-secret configuration shared by the Api and/or Streamer. Anything with a credential,
# token, or connection-string password lives in secrets.example.yaml / the real Secret instead —
# see deploy/README.md for the full inventory and the reasoning behind each split.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurastream2-config
  namespace: aurastream2
data:
  # Must NOT be "Testing" or "Smoke" — those two values switch every provider integration
  # (Gemini, Suno, Veo, YouTube, Buffer, Telegram, R2, yt-dlp) to an in-memory fake in
  # src/AuraStream2.Api/Program.cs. Any other value (this default, "Production") takes the
  # real branch.
  ASPNETCORE_ENVIRONMENT: "Production"

  # Api: media root inside the container. Must match the media PVC mount path below.
  Media__Root: "/media"

  # Streamer: scratch dir for pre-encoded visuals/concat files. Must be its OWN PVC mount,
  # never a subdirectory of /media — see media-pvc.yaml and streamer-work-pvc.yaml.
  Streamer__WorkDir: "/streamer-work"

  # Baked into both images already (Api and Streamer Dockerfiles ENV Ffmpeg__BinaryPath=ffmpeg).
  # Repeated here only so the full runtime surface is visible in one place; safe to delete.
  Ffmpeg__BinaryPath: "ffmpeg"

  # Baked into the Api image (fonts-dejavu-core installed at this path). meme-short and teaser
  # fail fast at assemble if this file doesn't exist in the image.
  Ffmpeg__FontPath: "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

  # Baked into the Api image (yt-dlp binary installed here). Only the Api uses it.
  YtDlp__BinaryPath: "/usr/local/bin/yt-dlp"

  # Buffer fetches published media BY URL from this base + /pub-media/... (PublicMediaLink), so it
  # must resolve from Buffer's servers, not just from inside the cluster.
  #
  # v2 serves on its own host. The old path-split route under v1's hostname was retired on
  # 2026-09-09, once every link minted against the old base had expired: PublicMediaLink gives
  # each token TimeSpan.FromHours(24), so no published link outlives a day.
  Publish__PublicMediaBaseUrl: "https://aurastream.stocznia.dev"

  # OIDC issuer for the console's users — ZITADEL's Internal Tools instance. The Api validates
  # tokens against this issuer's JWKS (fetched from {issuer}/.well-known/openid-configuration),
  # so no shared secret is involved: Oidc__JwtSecret exists only in the Testing/Smoke
  # appsettings, where a symmetric key signs locally minted test tokens.
  Oidc__Issuer: "https://identity.stocznia.dev"

  # ZITADEL puts the client ID in the access token's `aud` array, so the console's own client ID
  # is what the Api must accept. Same value as CI's VITE_OIDC_CLIENT_ID repo variable — an
  # application registered in ZITADEL as a PKCE public client, which is why it has no secret.
  Oidc__Audience: "389861331303465068"

  # Defaults already match the code's own defaults (StreamOptions.MinimumPoolTracks = 40,
  # AnalyticsOptions.PerformanceWindowDays = 90) — set explicitly so the deployed value is
  # visible without reading the source.
  Stream__MinimumPoolTracks: "40"
  Analytics__PerformanceWindowDays: "90"

  # The machine pool VideoWorkerSwitch rents from when it RECREATES the vast workergroup after a
  # stop. This is configuration rather than something the switch captures and replays: vast's read
  # returns search_query as an object while create takes search_params as a string, with no
  # documented conversion between the two.
  #
  # Leaving this unset is not neutral — the coded default is vast's own permissive
  # "verified=true rentable=true rented=false", which constrains nothing but availability, so a
  # recreated group could rent a machine outside every constraint below.
  #
  # dph caps RENTAL only: storage and bandwidth are separate line items, so real spend exceeds it.
  # inet_down/inet_up are Mb/s and matter because the first request on a fresh worker downloads
  # multi-gigabyte weights.
  Video__Workergroup__SearchParams: "gpu_ram>31 dph<1.0 inet_down>1000 inet_up>1000 verified=true rentable=true rented=false"
