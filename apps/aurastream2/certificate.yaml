# The console's own hostname, added 2026-09-08 with the ZITADEL auth migration.
#
# Until 2026-09-09 this file also held `aurastream2-tls`, a second certificate for v1's hostname
# (ns3098488.ip-54-36-172.eu) issued into this namespace because Kubernetes Secrets do not cross
# namespaces. It existed only to terminate TLS for the /aurastream2 prefix route, and both were
# retired together once every media link minted against that host had expired — PublicMediaLink
# gives each token a 24-hour lifetime, so none outlives a day. v1 holds its own certificate in
# its own namespace and is untouched.
#
# Traefik's IngressRoute carries a single `spec.tls`, so a host with its own certificate needs
# its own IngressRoute and its own Secret — see ingressroute.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aurastream2-stocznia-tls
  namespace: aurastream2
spec:
  secretName: aurastream2-stocznia-tls
  dnsNames:
    - aurastream.stocznia.dev
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
