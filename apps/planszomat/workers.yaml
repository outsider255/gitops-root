# Durable asynchronous workers. Recreate plus one replica preserves the single BGG gate and
# each name worker instance's adaptive Jev concurrency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgg-worker
  namespace: planszomat
spec:
  # Off: BGG (Cloudflare) answers 403/429 to the OVH node IP, so the worker only retried.
  # Run `bgg-worker` / `sync-bgg` by hand from a home IP through the DB tunnel instead.
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bgg-worker
  template:
    metadata:
      labels:
        app: bgg-worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cli
          image: ghcr.io/outsider255/planszomat-cli:aca1f4f89fbfe49442e4e7cd96466f1bb273eea9
          args: ["bgg-worker"]
          env:
            - name: PLANSZOMAT_DB
              valueFrom:
                secretKeyRef:
                  name: planszomat-db
                  key: PLANSZOMAT_DB
            - name: BGG_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planszomat-bgg
                  key: BGG_API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classify-names-worker
  namespace: planszomat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: classify-names-worker
  template:
    metadata:
      labels:
        app: classify-names-worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cli
          image: ghcr.io/outsider255/planszomat-cli:aca1f4f89fbfe49442e4e7cd96466f1bb273eea9
          args: ["classify-names-worker"]
          env:
            - name: PLANSZOMAT_DB
              valueFrom:
                secretKeyRef:
                  name: planszomat-db
                  key: PLANSZOMAT_DB
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planszomat-typesafe
                  key: TYPESAFE_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
