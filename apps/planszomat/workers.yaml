# Durable asynchronous workers. Recreate plus one replica preserves the single BGG gate and
# each name worker instance's adaptive OpenRouter concurrency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-worker
  namespace: planszomat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: match-worker
  template:
    metadata:
      labels:
        app: match-worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cli
          image: ghcr.io/outsider255/planszomat-cli:a50e6c0ff477efe08eeae21043f16792115519ac
          args: ["match-worker"]
          env:
            - name: PLANSZOMAT_DB
              valueFrom:
                secretKeyRef:
                  name: planszomat-db
                  key: PLANSZOMAT_DB
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: planszomat-openrouter
                  key: OPENROUTER_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
