# Postgres for Planszomat. Nothing here is reachable from outside the cluster — the node has a
# public IP and Postgres is among the most scanned ports on the internet. Reach it with
# scripts/db-tunnel.ps1, which forwards to the postgres-tunnel Service's ClusterIP.

# Headless: governs the StatefulSet and provides per-pod DNS. No ClusterIP by design.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: planszomat
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# An ordinary ClusterIP so the SSH tunnel has a stable address to forward to. A headless
# Service has none, which is why motookazja carries this second Service too.
apiVersion: v1
kind: Service
metadata:
  name: postgres-tunnel
  namespace: planszomat
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: planszomat
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  # Retain is already the default, but a default nobody has written down is not a
  # safeguard. This is currently the only thing standing between a deleted StatefulSet
  # and the permanent loss of price history that cannot be re-fetched.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: planszomat
            - name: POSTGRES_USER
              value: planszomat
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planszomat-db
                  key: POSTGRES_PASSWORD
            # The PVC root is not empty on first mount (lost+found), which
            # makes initdb refuse to run. Keeping the cluster in a subdirectory
            # is the standard workaround.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          # A startupProbe, which motookazja does not have. Without one, liveness starts
          # counting immediately and allows about three minutes before killing the pod —
          # enough for a normal start, not enough for WAL replay after an unclean shutdown
          # or for a restore. A database that gets killed mid-recovery crash-loops, and this
          # volume holds price history that cannot be re-fetched. Five minutes of patience
          # costs nothing on a good night.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "planszomat", "-d", "planszomat"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "planszomat", "-d", "planszomat"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "planszomat", "-d", "planszomat"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          # Sized for many concurrent crawlers: shared_buffers (128Mi) plus one backend
          # per connection. A night of 10-15 shops crawling at once is ~30 connections,
          # each with work_mem headroom, projecting ~550Mi peak — 1Gi left no margin.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        # local-path is node-local storage, which is what every other app on this cluster
        # uses. It means this volume has no redundancy underneath it: if the node is
        # replaced or its disk fails, the price history is gone, and no crawl can re-fetch
        # what a shop charged last March. Until the backup task lands, this PVC is the only
        # copy that exists.
        # local-path also does not enforce the 20Gi request below: it is a bind mount onto
        # the node's own disk, so the volume grows until the node's disk fills, taking down
        # every other application on the cluster, not just this one.
        storageClassName: local-path
        resources:
          requests:
            # Append-only price history plus a raw product_snapshot payload
            # written on every content-hash change (CLAUDE.md) — snapshots,
            # not price rows, dominate growth. Sized for a few dozen shops
            # and low-tens-of-thousands of matched products over ~1-2 years
            # before this needs revisiting; this volume can't be re-fetched
            # if it fills, so it errs above motookazja's 10Gi.
            storage: 20Gi
