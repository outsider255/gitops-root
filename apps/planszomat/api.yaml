# The read API. Strictly read-only — every route maps to a Core handler and nothing
# writes; it never runs migrations (the CLI does, and the runbook migrates by hand
# first). Exposed as api.najtanszaplansza.pl by ingress.yaml through the cluster's
# Traefik, with a Let's Encrypt certificate from cert-manager.
#
# Same pinning discipline as cronjobs.yaml: bump the image only to a SHA a green CI
# run on master has pushed. The API image is ghcr.io/outsider255/planszomat-api —
# built from Dockerfile.api, separate from the CLI image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planszomat-api
  namespace: planszomat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planszomat-api
  template:
    metadata:
      labels:
        app: planszomat-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/outsider255/planszomat-api:e3810c68c3d806e62e8cea5c7715c51390b34d2c
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PLANSZOMAT_DB
              valueFrom:
                secretKeyRef:
                  name: planszomat-db
                  key: PLANSZOMAT_DB
            - name: PLANSZOMAT_READ_MODEL
              value: catalog
            # Authentication is ZITADEL-only. All three values are required so the API
            # fails closed instead of starting with an incomplete trust boundary.
            - name: ZITADEL_ISSUER
              valueFrom:
                secretKeyRef:
                  name: planszomat-identity
                  key: ZITADEL_ISSUER
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: planszomat-identity
                  key: OIDC_AUDIENCE
            - name: ZITADEL_ROLE_CLAIM
              valueFrom:
                secretKeyRef:
                  name: planszomat-identity
                  key: ZITADEL_ROLE_CLAIM
          # TCP, not HTTP: there is no /health route, and probing /deals would run a
          # real database query every period for nothing.
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: planszomat-api
  namespace: planszomat
spec:
  selector:
    app: planszomat-api
  ports:
    - port: 80
      targetPort: http
