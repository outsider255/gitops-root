# UTC sequence: check-categories 00:30; crawls 01:00; match 03:00-04:15;
# check-matches 04:15-04:45; publish-issue 05:00; sync-bgg 06:00.
# The pipeline is crawls -> match -> check-matches -> publish-issue -> sync-bgg.
# The crawls run as independent parallel pods — measured at
# ~100-160Mi each, so the node (32Gi) and Postgres carry 10-15 at once without staggering;
# the ~90min gap to match absorbs a steady-state (~1h) crawl. See CLAUDE.md and
# docs/known-issues.md. Order is load-bearing: publish-issue's `fresh` section only counts
# a game as new if it was both
# crawled in the window AND already match_status = matched, so match must finish first.
# publish-issue also refuses unless a majority of enabled shops have a finished crawl_run
# for that UTC date — so a mass overrun still yields no issue rather than a wrong one, while
# one overrunning shop no longer sinks the whole night.
#
# Image is pinned to a git SHA, not :latest: a change in behaviour for a job nobody watches
# at 01:00 should always have a commit behind it and be revertible. Bump the SHA only to
# one a green CI run on master has actually pushed.
#
# All eight image lines below must move together — an operator who updates seven and misses
# the eighth gets ImagePullBackOff at 01:00 with no alerting anywhere in this project to
# surface it. Verify after any bump:
#   grep -o '^ *image: ghcr.io/outsider255/planszomat-cli:[^ ]*' cronjobs.yaml | sort -u
# must print exactly one line.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-categories
  namespace: planszomat
spec:
  timeZone: Etc/UTC
  # Before the crawls: a new category accepted in the morning's review-categories run
  # is crawled the following night. The job is two homepage fetches and a set-diff —
  # no model call, no third-party API beyond the shops themselves.
  schedule: "30 0 * * *"
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Same courtesy argument as the crawls: don't hammer a shop that just refused us.
      # Exit 1 also covers a dead selector (no-links), which retrying cannot fix.
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:a17157b4b5e2568517c7bc63fbffe702d28f557a
              # Queues category_review rows for the local review-categories CLI, which
              # rewrites the shop config in git; this job never changes crawl scope itself.
              args: ["check-categories"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-matches
  namespace: planszomat
spec:
  # A 15-minute start window plus this 15-minute deadline ends by 04:45, before publish.
  schedule: "15 4 * * *"
  timeZone: Etc/UTC
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:a17157b4b5e2568517c7bc63fbffe702d28f557a
              args: ["check-matches"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawl-rebel
  namespace: planszomat
spec:
  timeZone: Etc/UTC
  schedule: "0 1 * * *"
  # A node/controller outage over 01:00 should skip a badly-missed slot rather than
  # fire it late — concurrencyPolicy: Forbid only stops a job overlapping itself, and
  # a delayed crawl landing on top of match or publish-issue would scramble the night.
  startingDeadlineSeconds: 900
  # A crawl that overruns into the next night must not have a second copy
  # started on top of it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Kubernetes defaults to 6 retries. This project honours each shop's Crawl-delay
      # everywhere else; six unattended retries against a shop that may already be
      # rate-limiting or rejecting us would undo that.
      backoffLimit: 1
      # A full rebel crawl is about six hours today; seven bounds a genuinely wedged
      # crawl (stuck pod, unresponsive shop) without killing a slow-but-working one.
      activeDeadlineSeconds: 25200
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:a17157b4b5e2568517c7bc63fbffe702d28f557a
              args: ["crawl", "rebel"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
              # Starting point, not measured: a crawl holds shop pages in memory while
              # parsing HTML. If 1Gi is tight it gets OOMKilled, feeding a failure that
              # retrying cannot resolve. Check actual usage after the first night and
              # adjust.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
