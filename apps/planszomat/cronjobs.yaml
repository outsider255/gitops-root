apiVersion: batch/v1
kind: CronJob
metadata:
  name: match
  namespace: planszomat
spec:
  schedule: "30 3 * * *"
  # A node/controller outage over 01:00-03:30 should skip a badly-missed slot rather
  # than fire it late — concurrencyPolicy: Forbid only stops a job overlapping itself,
  # and a delayed match landing on top of publish-issue would scramble the night.
  startingDeadlineSeconds: 900
  # match must not overlap itself; the crawls it depends on are scheduled to have
  # finished well before this starts. Left on the default backoffLimit (6): a match
  # failure is usually a transient database problem, where retrying is the right
  # answer, and there is no third party here to annoy the way a retried crawl would.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:9ac69f631f81a560a5fa3b94d0e9d3ac60932dc2
              # Known gap, accepted for now: publish-issue's guard only checks that every
              # enabled shop has a finished crawl_run for the date — it does not check that
              # match has finished processing that crawl's offers. Sitemap-lastmod skipping
              # keeps a steady-state rebel night around an hour, so the slack holds — but a
              # full re-fetch night (the first ever, or after a wiped database) overruns
              # 03:30 and those offers stay unmatched until the next night. Not guarded
              # here — that would be a code change, not a manifest one.
              args: ["match"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
                # The CLI uses Gemini when GEMINI_API_KEY is set, Anthropic otherwise.
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-gemini
                      key: GEMINI_API_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: publish-issue
  namespace: planszomat
spec:
  schedule: "0 5 * * *"
  # A node/controller outage over 01:00-05:00 should skip a badly-missed slot rather
  # than fire it late — concurrencyPolicy: Forbid only stops a job overlapping itself.
  # publish-issue already refuses on an incomplete night, so a skipped night here costs
  # one issue rather than a scrambled one.
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      # A refusal to publish is a designed outcome, not a crash — the guard and the
      # migrations it runs first shouldn't be retried six times for it. Zero makes
      # the refusal exactly one Job that failed once.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:9ac69f631f81a560a5fa3b94d0e9d3ac60932dc2
              # No date argument: the command defaults to today in UTC, and the crawls
              # it depends on ran at 01:00-02:00 the same UTC day. It refuses to publish
              # unless every enabled shop finished a run that night, so a late crawl
              # yields no issue rather than one that reports an outage as news.
              args: ["publish-issue"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-bgg
  namespace: planszomat
spec:
  # After publish-issue (05:00): nothing downstream waits on alt names tonight — they
  # sharpen tomorrow's trigram matching, not today's issue.
  schedule: "0 6 * * *"
  startingDeadlineSeconds: 900
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # BGG throttles hard (5 s between requests); unattended retries against a
      # throttling API are the crawl argument all over again.
      backoffLimit: 1
      # A nightly slice is ~18 min (ceil(30k/7) ids at 20-per-5s). One hour bounds a
      # wedged run without killing a slow one.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:9ac69f631f81a560a5fa3b94d0e9d3ac60932dc2
              # No id-file: database mode syncs the ceil(n/7) stalest-synced bgg_item
              # rows, so the whole catalogue's alt names roll over every seven nights.
              args: ["sync-bgg"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
                - name: BGG_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-bgg
                      key: BGG_API_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
