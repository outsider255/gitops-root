# Nightly pipeline: three crawls, then match, then publish-issue. The gaps between
# schedules are deliberately generous — see CLAUDE.md and docs/known-issues.md. Order is
# load-bearing: publish-issue's `fresh` section only counts a game as new if it was both
# crawled in the window AND already match_status = matched, so match must finish first.
# publish-issue also refuses outright unless every enabled shop has a finished crawl_run
# for that UTC date — an overrunning crawl yields no issue rather than a wrong one.
#
# Image is pinned to a git SHA, not :latest: a change in behaviour for a job nobody watches
# at 01:00 should always have a commit behind it and be revertible. Bump the SHA only to
# one a green CI run on master has actually pushed.
#
# All six image lines below must move together — an operator who updates five and misses
# the sixth gets ImagePullBackOff at 01:00 with no alerting anywhere in this project to
# surface it. Verify after any bump:
#   grep -o '^ *image: ghcr.io/outsider255/planszomat-cli:[^ ]*' cronjobs.yaml | sort -u
# must print exactly one line.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crawl-rebel
  namespace: planszomat
spec:
  schedule: "0 1 * * *"
  # A node/controller outage over 01:00 should skip a badly-missed slot rather than
  # fire it late — concurrencyPolicy: Forbid only stops a job overlapping itself, and
  # a delayed crawl landing on top of match or publish-issue would scramble the night.
  startingDeadlineSeconds: 900
  # A crawl that overruns into the next night must not have a second copy
  # started on top of it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Kubernetes defaults to 6 retries. This project honours each shop's Crawl-delay
      # everywhere else; six unattended retries against a shop that may already be
      # rate-limiting or rejecting us would undo that.
      backoffLimit: 1
      # A full rebel crawl is about six hours today; seven bounds a genuinely wedged
      # crawl (stuck pod, unresponsive shop) without killing a slow-but-working one.
      activeDeadlineSeconds: 25200
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: cli
              image: ghcr.io/outsider255/planszomat-cli:9ac69f631f81a560a5fa3b94d0e9d3ac60932dc2
              args: ["crawl", "rebel"]
              env:
                - name: PLANSZOMAT_DB
                  valueFrom:
                    secretKeyRef:
                      name: planszomat-db
                      key: PLANSZOMAT_DB
              # Starting point, not measured: a crawl holds shop pages in memory while
              # parsing HTML. If 1Gi is tight it gets OOMKilled, feeding a failure that
              # retrying cannot resolve. Check actual usage after the first night and
              # adjust.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
---
