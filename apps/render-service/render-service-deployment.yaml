apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: render-outbox-pvc
  namespace: render-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-service
  namespace: render-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: render-service}
  template:
    metadata:
      labels: {app: render-service}
    spec:
      containers:
        - name: render-service
          image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
          ports:
            - containerPort: 80
          env:
            - {name: MODULE_NAME, value: 'main'}
          resources:
            requests: {cpu: '100m', memory: '128Mi'}
            limits: {cpu: '500m', memory: '256Mi'}
          volumeMounts:
            - name: app-code
              mountPath: /app/main.py
              subPath: main.py
            - name: outbox
              mountPath: /outbox
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 10
      volumes:
        - name: app-code
          configMap:
            name: render-service-app
        - name: outbox
          persistentVolumeClaim:
            claimName: render-outbox-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: render-service
  namespace: render-service
spec:
  type: ClusterIP
  selector: {app: render-service}
  ports:
    - {port: 80, targetPort: 80}
