apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: render-outbox-pvc
  namespace: render-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: render-service
  namespace: render-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: render-service}
  template:
    metadata:
      labels: {app: render-service}
    spec:
      serviceAccountName: render-service-sa
      containers:
        - name: render-service
          image: tiangolo/uvicorn-gunicorn-fastapi:python3.11
          ports:
            - containerPort: 80
          env:
            - {name: MODULE_NAME, value: 'main'}
            - {name: WEB_CONCURRENCY, value: '1'}
          resources:
            requests: {cpu: '200m', memory: '256Mi'}
            limits: {cpu: '500m', memory: '384Mi'}
          volumeMounts:
            - name: app-code
              mountPath: /app/main.py
              subPath: main.py
            - name: outbox
              mountPath: /outbox
            - name: assets
              mountPath: /assets
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: app-code
          configMap:
            name: render-service-app
        - name: outbox
          persistentVolumeClaim:
            claimName: render-outbox-pvc
        - name: assets
          persistentVolumeClaim:
            claimName: binary-assets-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: render-service
  namespace: render-service
spec:
  type: ClusterIP
  selector: {app: render-service}
  ports:
    - {port: 80, targetPort: 80}
