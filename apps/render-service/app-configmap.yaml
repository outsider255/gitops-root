apiVersion: v1
kind: ConfigMap
metadata:
  name: render-service-app
  namespace: render-service
data:
  main.py: |
    import asyncio
    import json
    import os
    import urllib.request

    from fastapi import FastAPI, HTTPException, BackgroundTasks
    from fastapi.concurrency import run_in_threadpool
    from pydantic import BaseModel
    from typing import Optional

    from kubernetes import client, config
    from kubernetes.client.exceptions import ApiException

    app = FastAPI()

    OUTBOX_BASE = "/outbox/"
    NAMESPACE = "render-service"
    JOBS = {}

    def job_phase_from_status(job_status) -> str:
        """Pure helper: maps a K8s V1JobStatus-like object to one of
        queued/running/completed/failed using status.conditions as the
        source of truth, NOT the status.failed/status.succeeded counters
        (kubernetes-client/python#1766: status.failed can be None even on
        a genuinely failed Job). Accepts any object exposing .conditions
        and .active attributes (the real V1JobStatus, or a lightweight
        test stub) so this logic is unit-testable without a live cluster.
        """
        conditions = getattr(job_status, "conditions", None) or []
        for cond in conditions:
            cond_type = getattr(cond, "type", None)
            cond_status = getattr(cond, "status", None)
            if cond_type == "Complete" and cond_status == "True":
                return "completed"
            if cond_type == "Failed" and cond_status == "True":
                return "failed"
        if getattr(job_status, "active", None):
            return "running"
        return "queued"

    def get_job_phase(job_name: str) -> str:
        """Reads the live Job status from the K8s API and maps it to
        queued/running/completed/failed via job_phase_from_status (Pattern 2:
        status.conditions is the source of truth, not bare counters).
        """
        config.load_incluster_config()
        batch = client.BatchV1Api()
        job = batch.read_namespaced_job_status(name=job_name, namespace=NAMESPACE)
        return job_phase_from_status(job.status)

    def build_echo_job_spec(job_id: str) -> "client.V1Job":
        """Builds a trivial busybox echo-and-exit Job spec (D-08): proves
        the dispatch mechanics end-to-end without any PVC mounts or real
        ffmpeg work (that's Phase 2). Image and command are hardcoded here,
        server-side, never derived from request input -- eliminating
        Job-spec injection for this dispatch-mechanics proof (T-01-02-01).
        """
        job_name = f"echo-{job_id}"
        container = client.V1Container(
            name="echo",
            image="busybox:1.36",
            command=["sh", "-c", "echo done && sleep 2"],
        )
        pod_template = client.V1PodTemplateSpec(
            metadata=client.V1ObjectMeta(labels={"job-id": job_id}),
            spec=client.V1PodSpec(containers=[container], restart_policy="Never"),
        )
        return client.V1Job(
            metadata=client.V1ObjectMeta(name=job_name),
            spec=client.V1JobSpec(
                template=pod_template,
                backoff_limit=2,
                ttl_seconds_after_finished=3600,
            ),
        )

    def _dispatch_echo_job_sync(job_id: str) -> str:
        config.load_incluster_config()
        batch = client.BatchV1Api()
        job_spec = build_echo_job_spec(job_id)
        batch.create_namespaced_job(namespace=NAMESPACE, body=job_spec)
        return job_spec.metadata.name

    async def dispatch_echo_job(job_id: str) -> str:
        """Async wrapper around the sync K8s client call -- run_in_threadpool
        avoids blocking the FastAPI event loop (Pitfall 3)."""
        return await run_in_threadpool(_dispatch_echo_job_sync, job_id)

    class OverlayConfig(BaseModel):
        qr_url: Optional[str] = None
        affirmation_text: Optional[str] = None
        watermark: Optional[str] = None

    class JobSpec(BaseModel):
        job_id: str
        video_id: str
        category: str
        track_ids: list[str]
        loop_ids: list[str]
        overlay_config: OverlayConfig = OverlayConfig()
        output_path: str
        resume_url: Optional[str] = None

    async def watch_echo_job_for_webhook(job: JobSpec):
        """Background task: polls the already-dispatched echo Job (dispatch
        itself already happened synchronously in /render, before this task
        was scheduled) purely so the resume_url webhook can be fired once
        the Job reaches a terminal phase. /status/{job_id} does its own
        live get_job_phase call and does NOT depend on this task's JOBS
        bookkeeping to report status -- this task only owns the
        webhook-notify-on-completion side effect and the output_path record.
        """
        job_name = f"echo-{job.job_id}"
        phase = "queued"
        while phase not in ("completed", "failed"):
            try:
                phase = await run_in_threadpool(get_job_phase, job_name)
            except ApiException as e:
                JOBS[job.job_id]["webhook_notified"] = False
                JOBS[job.job_id]["webhook_error"] = str(e)
                return
            if phase in ("completed", "failed"):
                break
            await asyncio.sleep(2)

        if phase == "completed":
            JOBS[job.job_id]["output_path"] = job.output_path

        if job.resume_url:
            try:
                # n8n's Wait-node webhook-resume endpoint only listens on GET by default;
                # the resumed workflow re-fetches job state itself via /status, so no body is needed here.
                urllib.request.urlopen(job.resume_url, timeout=10)
                JOBS[job.job_id]["webhook_notified"] = True
            except Exception as e:
                JOBS[job.job_id]["webhook_notified"] = False
                JOBS[job.job_id]["webhook_error"] = str(e)

    @app.post("/render", status_code=202)
    async def render(job: JobSpec, background_tasks: BackgroundTasks):
        real_base = os.path.realpath(OUTBOX_BASE)
        real_target = os.path.realpath(job.output_path)
        if not (real_target == real_base or real_target.startswith(real_base + os.sep)):
            raise HTTPException(status_code=400, detail=f"output_path must be under {OUTBOX_BASE}")

        os.makedirs(os.path.dirname(real_target), exist_ok=True)

        JOBS[job.job_id] = {"status": "accepted", "output_path": None}
        try:
            await dispatch_echo_job(job.job_id)
        except ApiException as e:
            JOBS[job.job_id]["status"] = "failed"
            JOBS[job.job_id]["error"] = str(e)
            raise HTTPException(status_code=502, detail=str(e))

        JOBS[job.job_id]["status"] = "queued"
        background_tasks.add_task(watch_echo_job_for_webhook, job)
        return {"job_id": job.job_id, "status": "accepted"}

    @app.get("/status/{job_id}")
    async def status(job_id: str):
        if job_id not in JOBS:
            raise HTTPException(status_code=404, detail="unknown job_id")

        job_name = f"echo-{job_id}"
        try:
            phase = await run_in_threadpool(get_job_phase, job_name)
        except ApiException as e:
            raise HTTPException(status_code=502, detail=str(e))

        JOBS[job_id]["status"] = phase
        return {"job_id": job_id, **JOBS[job_id]}

    @app.delete("/outbox/{job_id}")
    def delete_output(job_id: str):
        if job_id not in JOBS:
            raise HTTPException(status_code=404, detail="unknown job_id")
        output_path = JOBS[job_id].get("output_path")
        if not output_path:
            raise HTTPException(status_code=400, detail="job has no output_path (not completed yet)")

        real_base = os.path.realpath(OUTBOX_BASE)
        real_target = os.path.realpath(output_path)
        if not (real_target == real_base or real_target.startswith(real_base + os.sep)):
            raise HTTPException(status_code=400, detail=f"output_path must be under {OUTBOX_BASE}")

        if not os.path.exists(real_target):
            raise HTTPException(status_code=404, detail="output file not found on disk")

        os.remove(real_target)
        JOBS[job_id]["deleted"] = True
        return {"job_id": job_id, "deleted": True}

    @app.get("/healthz")
    def healthz():
        return {"ok": True}
