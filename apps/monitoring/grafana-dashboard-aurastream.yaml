apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-aurastream
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  aurastream.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": ["aurastream"],
      "time": {"from": "now-6h", "to": "now"},
      "title": "Aurastream",
      "uid": "aurastream-infra",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {},
            "regex": ""
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pod Ready (up/down)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (kube_pod_status_ready{namespace=\"aurastream\", condition=\"true\"})", "legendFormat": "{{pod}}", "instant": true}
          ],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "orientation": "horizontal"},
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU (cores)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"aurastream\", container!=\"\", container!=\"POD\"}[5m]))", "legendFormat": "{{pod}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory (working set)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"aurastream\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Network I/O",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=\"aurastream\"}[5m]))", "legendFormat": "{{pod}} rx"},
            {"refId": "B", "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=\"aurastream\"}[5m]))", "legendFormat": "{{pod}} tx"}
          ],
          "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["mean"]}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Container Restarts (1h increase)",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {"refId": "A", "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"aurastream\"}[1h]))", "legendFormat": "{{pod}}"}
          ],
          "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "bars", "fillOpacity": 50}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["sum"]}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 6,
          "type": "gauge",
          "title": "Node Disk Used % (/)",
          "description": "PVCs use local-path (hostPath), so per-PVC metrics report the whole node disk. This shows the shared root filesystem instead.",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "targets": [
            {"refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"\"})", "legendFormat": "{{instance}}", "instant": true}
          ],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 75}, {"color": "red", "value": 90}]}}, "overrides": []},
          "options": {"orientation": "auto", "showThresholdLabels": false, "showThresholdMarkers": true, "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Node Disk (/) Used vs Total",
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "targets": [
            {"refId": "A", "expr": "node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"\"} - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!=\"\"}", "legendFormat": "used"},
            {"refId": "B", "expr": "node_filesystem_size_bytes{mountpoint=\"/\", fstype!=\"\"}", "legendFormat": "total"}
          ],
          "fieldConfig": {"defaults": {"unit": "bytes", "custom": {"drawStyle": "line", "fillOpacity": 10}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["last"]}, "tooltip": {"mode": "multi"}}
        }
      ]
    }
