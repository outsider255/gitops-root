apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zitadel-rate-limit
  namespace: zitadel
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zitadel-public-metrics-deny
  namespace: zitadel
spec:
  # Documentation-only address space: no Internet client can satisfy this allow-list.
  # Applied only to the exact public metrics route below, it makes Traefik return 403
  # before contacting the core Service.
  ipAllowList:
    sourceRange:
      - 192.0.2.1/32
      - 2001:db8::1/128
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel-system-public-metrics-deny
  namespace: zitadel
spec:
  entryPoints:
    - websecure
  routes:
    # Explicit priority prevents the ordinary Ingress / Prefix route below from
    # exposing metrics. Path() deliberately leaves all other /debug/* endpoints alone.
    - match: Host(`identity.najtanszaplansza.pl`) && Path(`/debug/metrics`)
      kind: Rule
      priority: 200
      middlewares:
        - name: zitadel-public-metrics-deny
      services:
        # The deny middleware short-circuits before this backend is contacted.
        - name: zitadel
          port: 8080
  tls:
    secretName: zitadel-system-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel-planszomat-public-metrics-deny
  namespace: zitadel
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`login.najtanszaplansza.pl`) && Path(`/debug/metrics`)
      kind: Rule
      priority: 200
      middlewares:
        - name: zitadel-public-metrics-deny
      services:
        - name: zitadel
          port: 8080
  tls:
    secretName: zitadel-planszomat-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel
  namespace: zitadel
  annotations:
    # Deploy after the Task 2 core/Login V2 workloads at Sync wave 3.
    argocd.argoproj.io/sync-wave: "4"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: zitadel-zitadel-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: identity.najtanszaplansza.pl
      http:
        paths:
          # Kubernetes ingress matching gives this longer Prefix path precedence over /.
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
    - host: login.najtanszaplansza.pl
      http:
        paths:
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
  tls:
    - hosts:
        - identity.najtanszaplansza.pl
      secretName: zitadel-system-tls
    - hosts:
        - login.najtanszaplansza.pl
      secretName: zitadel-planszomat-tls
