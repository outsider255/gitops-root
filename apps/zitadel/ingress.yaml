apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: zitadel-rate-limit
  namespace: zitadel
spec:
  rateLimit:
    average: 50
    burst: 100
    period: 1s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel
  namespace: zitadel
  annotations:
    # Deploy after the Task 2 core/Login V2 workloads at Sync wave 3.
    argocd.argoproj.io/sync-wave: "4"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: zitadel-zitadel-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: identity.najtanszaplansza.pl
      http:
        paths:
          # Kubernetes ingress matching gives this longer Prefix path precedence over /.
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
    - host: login.najtanszaplansza.pl
      http:
        paths:
          - path: /ui/v2/login
            pathType: Prefix
            backend:
              service:
                name: zitadel-login
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zitadel
                port:
                  number: 8080
  tls:
    - hosts:
        - identity.najtanszaplansza.pl
      secretName: zitadel-system-tls
    - hosts:
        - login.najtanszaplansza.pl
      secretName: zitadel-planszomat-tls
