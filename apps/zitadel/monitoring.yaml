apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    release: monitoring
spec:
  groups:
    - name: zitadel
      rules:
        - alert: ZitadelTargetDown
          expr: |
            min by (namespace, service) (up{namespace="zitadel",service="zitadel"}) == 0
              or absent(up{namespace="zitadel",service="zitadel"})
              or min by (namespace, service) (up{namespace="zitadel",service="zitadel-login"}) == 0
              or absent(up{namespace="zitadel",service="zitadel-login"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: ZITADEL metrics target is unavailable
        - alert: ZitadelCertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds{namespace="zitadel",name=~"zitadel-(system|planszomat)-tls"} - time() < 14 * 24 * 60 * 60
          labels:
            severity: warning
          annotations:
            summary: ZITADEL certificate expires in less than 14 days
            description: Certificate {{ $labels.name }} is approaching expiry.
        - alert: ZitadelPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="zitadel"}[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: A ZITADEL container restarted
            description: Container {{ $labels.container }} in pod {{ $labels.pod }} restarted during the last 15 minutes.
        - alert: ZitadelPostgresNotReady
          expr: |
            kube_pod_status_ready{namespace="zitadel",pod="zitadel-postgres-0",condition="true"} == 0
              or absent(kube_pod_status_ready{namespace="zitadel",pod="zitadel-postgres-0",condition="true"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: ZITADEL PostgreSQL is not ready
        - alert: ZitadelPostgresDiskLow
          expr: |
            kubelet_volume_stats_available_bytes{namespace="zitadel",persistentvolumeclaim="postgres-data-zitadel-postgres-0"}
              /
            kubelet_volume_stats_capacity_bytes{namespace="zitadel",persistentvolumeclaim="postgres-data-zitadel-postgres-0"}
              < 0.15
          labels:
            severity: warning
          annotations:
            summary: ZITADEL PostgreSQL volume has less than 15% free space
        - alert: ZitadelSetupJobFailed
          expr: kube_job_status_failed{namespace="zitadel"} > 0
          labels:
            severity: critical
          annotations:
            summary: A ZITADEL setup Job failed
            description: Job {{ $labels.job_name }} has a failed pod.
