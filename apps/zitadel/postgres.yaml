apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-postgres-init
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  10-create-zitadel.sh: |
    #!/bin/sh
    set -eu
    export PGPASSWORD="$POSTGRES_PASSWORD"
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=ON_ERROR_STOP=1 <<'SQL'
    \getenv zitadel_password ZITADEL_DB_PASSWORD
    SELECT format('CREATE ROLE zitadel LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'zitadel_password')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'zitadel') \gexec
    ALTER ROLE zitadel LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD :'zitadel_password';
    SELECT format('CREATE DATABASE zitadel OWNER zitadel')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'zitadel') \gexec
    ALTER DATABASE zitadel OWNER TO zitadel;
    SQL
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-postgres
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-postgres
  namespace: zitadel
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zitadel-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-postgres-egress
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-postgres
  policyTypes:
    - Egress
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel-postgres
  namespace: zitadel
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: zitadel-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: zitadel-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zitadel-postgres
      annotations:
        zitadel.najtanszaplansza.pl/external-secret-revision: "1"
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db
                  key: POSTGRES_PASSWORD
            - name: ZITADEL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db
                  key: ZITADEL_PASSWORD
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-db
                  key: ZITADEL_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          startupProbe:
            exec:
              command: ["psql", "-h", "127.0.0.1", "-U", "zitadel", "-d", "zitadel", "-Atqc", "SELECT 1"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["psql", "-h", "127.0.0.1", "-U", "zitadel", "-d", "zitadel", "-Atqc", "SELECT 1"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "zitadel", "-d", "zitadel"]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
      serviceAccountName: zitadel-postgres
      volumes:
        - name: postgres-init
          configMap:
            name: zitadel-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
