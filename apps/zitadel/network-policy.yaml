apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-postgres-ingress
  namespace: zitadel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zitadel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel
              app.kubernetes.io/instance: zitadel
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [init, setup, start]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zitadel-core-ingress
  namespace: zitadel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/instance: zitadel
      app.kubernetes.io/component: start
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: zitadel
          podSelector:
            matchLabels:
              app.kubernetes.io/name: zitadel-login
              app.kubernetes.io/instance: zitadel
              app.kubernetes.io/component: login
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: monitoring-kube-prometheus-prometheus
      ports:
        - protocol: TCP
          port: 8080
---
