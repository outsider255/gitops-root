replicaCount: 2

image:
  repository: ghcr.io/zitadel/zitadel
  tag: v4.17.1
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

service:
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c

ingress:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring

zitadel:
  masterkeySecretName: zitadel-masterkey
  configSecretName: zitadel-runtime-config
  configSecretKey: config-yaml
  configmapConfig:
    ExternalDomain: identity.najtanszaplansza.pl
    ExternalPort: 443
    ExternalSecure: true
    TLS:
      Enabled: false
    # Provisioning uses the external System API user and runtime-config Human.
    # Disable the chart's default iam-admin machine/PAT writers and their RBAC.
    FirstInstance:
      # The later external config overlay must also set this false initially.
      # Retirement sets this true while removing FirstInstance from that overlay.
      Skip: false
      Org:
        Machine: null
    SystemAPIUsers:
      system-bootstrap:
        Path: /system-api/system-user.pub
        Memberships:
          - MemberType: System
            Roles:
              - SYSTEM_OWNER

extraVolumes:
  - name: system-api-public
    secret:
      secretName: zitadel-system-api-public
extraVolumeMounts:
  - name: system-api-public
    mountPath: /system-api
    readOnly: true

podAnnotations:
  zitadel.najtanszaplansza.pl/external-secret-revision: "1"
  zitadel.najtanszaplansza.pl/system-api-key-revision: "1"

login:
  enabled: true
  loginServiceKeySecretName: zitadel-login-service-key
  customConfigmapConfig: |
    ZITADEL_LOGINCLIENT_KEYFILE="/login-service-key/tls.key"
    AUDIENCE="https://${ZITADEL_EXTERNALDOMAIN}"
    ZITADEL_API_URL="http://zitadel:8080"
    CUSTOM_REQUEST_HEADERS="Host:${ZITADEL_EXTERNALDOMAIN}"
  replicaCount: 2
  image:
    repository: ghcr.io/zitadel/zitadel-login
    tag: v4.17.1
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  podAnnotations:
    zitadel.najtanszaplansza.pl/external-secret-revision: "1"
  serviceAccount:
    create: false
    name: zitadel-login

postgresql:
  enabled: false

annotations:
  argocd.argoproj.io/sync-wave: "3"

initJob:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"

setupJob:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"

cleanupJob:
  enabled: false

serviceAccount:
  create: false
  name: zitadel-runtime
