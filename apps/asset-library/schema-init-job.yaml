apiVersion: batch/v1
kind: Job
metadata:
  name: asset-library-schema-init
  namespace: render-service
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: schema-init
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import sqlite3
              conn = sqlite3.connect('/data/library.db')
              conn.executescript(open('/sql/schema.sql').read())
              conn.executescript(open('/sql/seed.sql').read())
              conn.commit()
              conn.close()
              print('schema + seed applied')
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sql
              mountPath: /sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asset-library-pvc
        - name: sql
          configMap:
            name: asset-library-schema
