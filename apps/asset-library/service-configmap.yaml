apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-library-service-app
  namespace: render-service
data:
  main.py: |
    import base64
    import json
    import os
    import sqlite3
    import uuid
    from typing import Optional

    from fastapi import FastAPI, HTTPException
    from fastapi.responses import FileResponse
    from pydantic import BaseModel

    app = FastAPI()
    DB_PATH = "/data/library.db"
    ASSETS_DIR = "/assets/stills"

    def get_conn():
        conn = sqlite3.connect(DB_PATH)
        conn.row_factory = sqlite3.Row
        return conn

    class TrackIn(BaseModel):
        file_path: str
        duration_s: float
        category: str
        mood_tags: list[str] = []
        bpm: Optional[int] = None
        qa_passed: bool = False

    class LoopIn(BaseModel):
        file_path: str
        duration_s: float
        category: str
        scene_tags: list[str] = []
        qa_gates_passed: dict = {}
        orientation: str = "horizontal"

    class LoopPatch(BaseModel):
        crop_focal_x: Optional[float] = None
        crop_focal_y: Optional[float] = None

    @app.post("/tracks", status_code=201)
    def create_track(track: TrackIn):
        track_id = f"trk_{uuid.uuid4().hex[:10]}"
        conn = get_conn()
        conn.execute(
            "INSERT INTO track_library (id, file_path, duration_s, category, mood_tags, bpm, status, qa_passed) "
            "VALUES (?, ?, ?, ?, ?, ?, 'active', ?)",
            (track_id, track.file_path, track.duration_s, track.category, json.dumps(track.mood_tags), track.bpm, int(track.qa_passed)),
        )
        conn.commit()
        conn.close()
        return {"id": track_id}

    @app.get("/tracks")
    def list_tracks(category: Optional[str] = None, status: str = "active"):
        conn = get_conn()
        query = "SELECT * FROM track_library WHERE status = ?"
        params = [status]
        if category:
            query += " AND category = ?"
            params.append(category)
        rows = conn.execute(query, params).fetchall()
        conn.close()
        return [dict(r) for r in rows]

    @app.post("/loops", status_code=201)
    def create_loop(loop: LoopIn):
        loop_id = f"loop_{uuid.uuid4().hex[:10]}"
        conn = get_conn()
        conn.execute(
            "INSERT INTO visual_loop_library (id, file_path, duration_s, category, scene_tags, status, qa_gates_passed, orientation) "
            "VALUES (?, ?, ?, ?, ?, 'active', ?, ?)",
            (loop_id, loop.file_path, loop.duration_s, loop.category, json.dumps(loop.scene_tags), json.dumps(loop.qa_gates_passed), loop.orientation),
        )
        conn.commit()
        conn.close()
        return {"id": loop_id}

    @app.get("/loops")
    def list_loops(category: Optional[str] = None, status: str = "active"):
        conn = get_conn()
        query = "SELECT * FROM visual_loop_library WHERE status = ?"
        params = [status]
        if category:
            query += " AND category = ?"
            params.append(category)
        rows = conn.execute(query, params).fetchall()
        conn.close()
        return [dict(r) for r in rows]

    import random
    from datetime import datetime, timedelta

    EXCLUSION_WINDOW_DAYS = 3

    def _weighted_random_select(rows: list[dict]) -> dict:
        """Favors low use_count: weight = 1 / (use_count + 1), so a
        never-used row (use_count=0) is twice as likely as a once-used
        row, etc. Pure function -- no DB access -- so it's unit-testable
        against plain dict lists."""
        weights = [1.0 / (r["use_count"] + 1) for r in rows]
        return random.choices(rows, weights=weights, k=1)[0]

    def _exclude_recently_used(rows: list[dict], window_days: int = EXCLUSION_WINDOW_DAYS) -> list[dict]:
        cutoff = datetime.utcnow() - timedelta(days=window_days)
        result = []
        for r in rows:
            if not r["last_used_at"]:
                result.append(r)
                continue
            last_used = datetime.fromisoformat(r["last_used_at"])
            if last_used < cutoff:
                result.append(r)
        return result

    def _select_n_without_replacement(eligible: list[dict], n: int) -> list[dict]:
        """Weighted pick of n distinct rows, refilling the pool from the
        full eligible set if it runs out (so n can exceed the eligible
        count without erroring -- repeats are fine, an empty pool isn't)."""
        selected = []
        pool = list(eligible)
        for _ in range(n):
            if not pool:
                pool = list(eligible)
            choice = _weighted_random_select(pool)
            selected.append(choice)
            pool = [r for r in pool if r["id"] != choice["id"]]
        return selected

    @app.get("/tracks/select")
    def select_track(category: str, n: int = 1):
        conn = get_conn()
        rows = [dict(r) for r in conn.execute(
            "SELECT * FROM track_library WHERE category = ? AND status = 'active' AND qa_passed = 1",
            (category,),
        ).fetchall()]
        conn.close()
        if not rows:
            raise HTTPException(status_code=404, detail=f"no active tracks for category {category}")
        eligible = _exclude_recently_used(rows) or rows
        return _select_n_without_replacement(eligible, n)

    @app.get("/loops/select")
    def select_loops(category: str, n: int = 2, orientation: str = "horizontal"):
        conn = get_conn()
        rows = [dict(r) for r in conn.execute(
            "SELECT * FROM visual_loop_library WHERE category = ? AND status = 'active' AND orientation = ?",
            (category, orientation),
        ).fetchall()]
        conn.close()
        if len(rows) < n:
            raise HTTPException(status_code=404, detail=f"only {len(rows)} active {orientation} loops for category {category}, need {n}")
        eligible = _exclude_recently_used(rows) or rows
        return _select_n_without_replacement(eligible, n)

    @app.get("/tracks/{track_id}")
    def get_track(track_id: str):
        conn = get_conn()
        row = conn.execute("SELECT * FROM track_library WHERE id = ?", (track_id,)).fetchone()
        conn.close()
        if not row:
            raise HTTPException(status_code=404, detail=f"no track with id {track_id}")
        return dict(row)

    @app.get("/loops/{loop_id}")
    def get_loop(loop_id: str):
        conn = get_conn()
        row = conn.execute("SELECT * FROM visual_loop_library WHERE id = ?", (loop_id,)).fetchone()
        conn.close()
        if not row:
            raise HTTPException(status_code=404, detail=f"no loop with id {loop_id}")
        return dict(row)

    @app.patch("/loops/{loop_id}")
    def patch_loop(loop_id: str, patch: LoopPatch):
        conn = get_conn()
        cur = conn.execute(
            "UPDATE visual_loop_library SET crop_focal_x = ?, crop_focal_y = ? WHERE id = ?",
            (patch.crop_focal_x, patch.crop_focal_y, loop_id),
        )
        conn.commit()
        conn.close()
        if cur.rowcount == 0:
            raise HTTPException(status_code=404, detail=f"no loop with id {loop_id}")
        return {"id": loop_id, "crop_focal_x": patch.crop_focal_x, "crop_focal_y": patch.crop_focal_y}

    @app.post("/tracks/{track_id}/mark-used")
    def mark_track_used(track_id: str):
        conn = get_conn()
        cur = conn.execute(
            "UPDATE track_library SET use_count = use_count + 1, last_used_at = ? WHERE id = ?",
            (datetime.utcnow().isoformat(), track_id),
        )
        conn.commit()
        if cur.rowcount == 0:
            conn.close()
            raise HTTPException(status_code=404, detail="unknown track id")
        conn.close()
        return {"id": track_id, "marked_used": True}

    @app.post("/loops/{loop_id}/mark-used")
    def mark_loop_used(loop_id: str):
        conn = get_conn()
        cur = conn.execute(
            "UPDATE visual_loop_library SET use_count = use_count + 1, last_used_at = ? WHERE id = ?",
            (datetime.utcnow().isoformat(), loop_id),
        )
        conn.commit()
        if cur.rowcount == 0:
            conn.close()
            raise HTTPException(status_code=404, detail="unknown loop id")
        conn.close()
        return {"id": loop_id, "marked_used": True}

    @app.post("/tracks/{track_id}/retire")
    def retire_track(track_id: str):
        conn = get_conn()
        cur = conn.execute("UPDATE track_library SET status = 'retired' WHERE id = ?", (track_id,))
        conn.commit()
        if cur.rowcount == 0:
            conn.close()
            raise HTTPException(status_code=404, detail="unknown track id")
        conn.close()
        return {"id": track_id, "retired": True}

    @app.post("/loops/{loop_id}/retire")
    def retire_loop(loop_id: str):
        conn = get_conn()
        cur = conn.execute("UPDATE visual_loop_library SET status = 'retired' WHERE id = ?", (loop_id,))
        conn.commit()
        if cur.rowcount == 0:
            conn.close()
            raise HTTPException(status_code=404, detail="unknown loop id")
        conn.close()
        return {"id": loop_id, "retired": True}

    class AffirmationIn(BaseModel):
        text: str

    class TitleWordIn(BaseModel):
        category: str
        word: str

    @app.post("/affirmations", status_code=201)
    def create_affirmation(item: AffirmationIn):
        item_id = f"aff_{uuid.uuid4().hex[:10]}"
        conn = get_conn()
        conn.execute(
            "INSERT INTO affirmation_bank (id, text, status) VALUES (?, ?, 'active')",
            (item_id, item.text),
        )
        conn.commit()
        conn.close()
        return {"id": item_id}

    @app.get("/affirmations")
    def list_affirmations(status: str = "active"):
        conn = get_conn()
        rows = conn.execute("SELECT * FROM affirmation_bank WHERE status = ?", (status,)).fetchall()
        conn.close()
        return [dict(r) for r in rows]

    @app.post("/title-words", status_code=201)
    def create_title_word(item: TitleWordIn):
        item_id = f"tw_{uuid.uuid4().hex[:10]}"
        conn = get_conn()
        conn.execute(
            "INSERT INTO title_word_bank (id, category, word, status) VALUES (?, ?, ?, 'active')",
            (item_id, item.category, item.word),
        )
        conn.commit()
        conn.close()
        return {"id": item_id}

    @app.get("/title-words")
    def list_title_words(category: Optional[str] = None, status: str = "active"):
        conn = get_conn()
        query = "SELECT * FROM title_word_bank WHERE status = ?"
        params = [status]
        if category:
            query += " AND category = ?"
            params.append(category)
        rows = conn.execute(query, params).fetchall()
        conn.close()
        return [dict(r) for r in rows]

    class AssetUploadIn(BaseModel):
        filename: str
        content_base64: str

    @app.post("/visual-assets/upload", status_code=201)
    def upload_visual_asset(item: AssetUploadIn):
        safe_name = os.path.basename(item.filename)
        if not safe_name or safe_name in (".", ".."):
            raise HTTPException(status_code=400, detail="invalid filename")
        os.makedirs(ASSETS_DIR, exist_ok=True)
        target = os.path.join(ASSETS_DIR, safe_name)
        try:
            data = base64.b64decode(item.content_base64)
        except Exception:
            raise HTTPException(status_code=400, detail="content_base64 is not valid base64")
        with open(target, "wb") as f:
            f.write(data)
        return {"file_path": target}

    CHARACTER_REFERENCE_PATH = os.path.join(ASSETS_DIR, "character_reference.jpg")

    class CharacterReferenceIn(BaseModel):
        content_base64: str

    @app.get("/character-reference")
    def get_character_reference():
        """Serves the canonical character still used to keep the forest
        spirit's appearance consistent across generations. 404 until the
        first one is set via POST -- callers (Mode A) treat a 404 here as
        the bootstrap case and fall back to text-only prompting."""
        if not os.path.exists(CHARACTER_REFERENCE_PATH):
            raise HTTPException(status_code=404, detail="no character reference set yet")
        return FileResponse(CHARACTER_REFERENCE_PATH, media_type="image/jpeg")

    @app.post("/character-reference", status_code=201)
    def set_character_reference(item: CharacterReferenceIn):
        os.makedirs(ASSETS_DIR, exist_ok=True)
        try:
            data = base64.b64decode(item.content_base64)
        except Exception:
            raise HTTPException(status_code=400, detail="content_base64 is not valid base64")
        with open(CHARACTER_REFERENCE_PATH, "wb") as f:
            f.write(data)
        return {"file_path": CHARACTER_REFERENCE_PATH}

    @app.get("/healthz")
    def healthz():
        return {"ok": True}
