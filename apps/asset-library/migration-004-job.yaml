apiVersion: batch/v1
kind: Job
metadata:
  name: asset-library-migration-004
  namespace: render-service
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              import sqlite3
              conn = sqlite3.connect('/data/library.db')
              existing = [r[1] for r in conn.execute('PRAGMA table_info(visual_loop_library)').fetchall()]
              if 'orientation' not in existing:
                  conn.execute("ALTER TABLE visual_loop_library ADD COLUMN orientation TEXT NOT NULL DEFAULT 'horizontal'")
                  conn.commit()
                  print('migration 004 applied: visual_loop_library.orientation')
              else:
                  print('migration 004: orientation already exists, skipped')
              conn.close()
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sql
              mountPath: /sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: asset-library-pvc
        - name: sql
          configMap:
            name: asset-library-migration-004
