apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-library-schema
  namespace: render-service
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS track_library (
      id TEXT PRIMARY KEY,
      file_path TEXT NOT NULL,
      duration_s REAL NOT NULL,
      category TEXT NOT NULL CHECK (category IN ('deep_focus','rainy_day','night_focus','gentle_morning')),
      mood_tags TEXT NOT NULL DEFAULT '[]',
      bpm INTEGER,
      created_at TEXT NOT NULL DEFAULT (datetime('now')),
      use_count INTEGER NOT NULL DEFAULT 0,
      last_used_at TEXT,
      last_used_category TEXT,
      status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','retired')),
      qa_passed INTEGER NOT NULL DEFAULT 0
    );

    CREATE TABLE IF NOT EXISTS visual_loop_library (
      id TEXT PRIMARY KEY,
      file_path TEXT NOT NULL,
      duration_s REAL NOT NULL,
      category TEXT NOT NULL CHECK (category IN ('deep_focus','rainy_day','night_focus','gentle_morning')),
      scene_tags TEXT NOT NULL DEFAULT '[]',
      created_at TEXT NOT NULL DEFAULT (datetime('now')),
      use_count INTEGER NOT NULL DEFAULT 0,
      last_used_at TEXT,
      status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','retired')),
      qa_gates_passed TEXT NOT NULL DEFAULT '{}',
      ssim_vs_library REAL
    );

    CREATE TABLE IF NOT EXISTS affirmation_bank (
      id TEXT PRIMARY KEY,
      text TEXT NOT NULL,
      created_at TEXT NOT NULL DEFAULT (datetime('now')),
      use_count INTEGER NOT NULL DEFAULT 0,
      last_used_at TEXT,
      status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','retired'))
    );

    CREATE TABLE IF NOT EXISTS title_word_bank (
      id TEXT PRIMARY KEY,
      category TEXT NOT NULL CHECK (category IN ('deep_focus','rainy_day','night_focus','gentle_morning')),
      word TEXT NOT NULL,
      created_at TEXT NOT NULL DEFAULT (datetime('now')),
      use_count INTEGER NOT NULL DEFAULT 0,
      last_used_at TEXT,
      status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active','retired'))
    );
  seed.sql: |
