# Without this the ConfigMap is empty, `policy.default` is empty, and an SSO user who
# authenticates successfully lands with no permissions at all — a blank UI, not an error.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Match subjects on the `email` claim. ZITADEL's default claim set has no `groups`, which
  # is what ArgoCD would otherwise look for, so every SSO login would match nothing.
  scopes: '[email]'

  # Deny by default: a stranger who authenticates against the instance gets nothing.
  policy.default: ''

  policy.csv: |
    g, giffcik.pl@gmail.com, role:admin
