apiVersion: batch/v1
kind: CronJob
metadata:
  name: city-events-normalise
  namespace: city-events
spec:
  schedule: "*/30 * * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: normalise
              image: ghcr.io/outsider255/city-events-jobs:2518359af0241dbd6be4b662c03ca50657d4530e
              args: ["normalise"]
              env:
                - name: ConnectionStrings__Db
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: ConnectionStrings__Db
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: NTFY_URL
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi

