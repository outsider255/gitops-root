apiVersion: batch/v1
kind: CronJob
metadata:
  name: city-events-watch
  namespace: city-events
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: watch
              image: ghcr.io/outsider255/city-events-jobs:78a9e2a87748d6c79c0d0f6d58089226ae6b6fb3
              args: ["watch"]
              env:
                - name: ConnectionStrings__Db
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: ConnectionStrings__Db
                - name: Apify__Token
                  valueFrom:
                    secretKeyRef:
                      name: city-events-apify
                      key: token
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi

