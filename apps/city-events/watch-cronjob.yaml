apiVersion: batch/v1
kind: CronJob
metadata:
  name: city-events-watch
  namespace: city-events
spec:
  schedule: "0 2 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: watch
              image: ghcr.io/outsider255/city-events-jobs:801c9c659c774ddedf4a728d8e6869e0ac4ef398
              args: ["watch"]
              env:
                - name: ConnectionStrings__Db
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: ConnectionStrings__Db
                - name: Apify__Token
                  valueFrom:
                    secretKeyRef:
                      name: city-events-apify
                      key: token
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi

