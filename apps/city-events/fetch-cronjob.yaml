apiVersion: batch/v1
kind: CronJob
metadata:
  name: city-events-fetch
  namespace: city-events
spec:
  schedule: "0 1 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: fetch
              image: ghcr.io/outsider255/city-events-jobs:1d755a3f275589f08f0d94515c3b72e788009d1d
              args: ["fetch", "--quiet"]
              env:
                - name: ConnectionStrings__Db
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: ConnectionStrings__Db
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi
