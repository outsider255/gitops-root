apiVersion: batch/v1
kind: CronJob
metadata:
  name: city-events-discover
  namespace: city-events
spec:
  schedule: "0 3 * * 1"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: discover
              image: ghcr.io/outsider255/city-events-jobs:d4d90bba690a65777476f4a3a1d1bf2a5c6d3681
              args: ["discover"]
              env:
                - name: ConnectionStrings__Db
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: ConnectionStrings__Db
                - name: NTFY_URL
                  valueFrom:
                    secretKeyRef:
                      name: city-events-secrets
                      key: NTFY_URL
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi
