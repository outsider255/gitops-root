# Runs before every sync: apply EF migrations, then load curated YAML (venues, category map, Meetup groups).
apiVersion: batch/v1
kind: Job
metadata:
  name: city-events-migrate
  namespace: city-events
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: migrate
          image: ghcr.io/outsider255/city-events-jobs:a3775793adacf8b7887e2a9a4b4f8056fb58ca2b
          command: ["sh", "-c", "dotnet CityEvents.Jobs.dll migrate && dotnet CityEvents.Jobs.dll seed --data /app/data"]
          env:
            - name: ConnectionStrings__Db
              valueFrom:
                secretKeyRef:
                  name: city-events-secrets
                  key: ConnectionStrings__Db
