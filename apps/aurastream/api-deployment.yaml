apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: aurastream
spec:
  selector:
    app: api
  ports:
    - port: 5075
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aurastream
spec:
  replicas: 1
  strategy:
    type: Recreate   # single Hangfire node + RWO media PVC — never two apis at once
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/outsider255/aurastream-api:7ff4030421e729c6cd402ff01f7a75848a0f225b
          ports:
            - containerPort: 5075
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:5075
            - name: Media__RootPath
              value: /media
            - name: DataProtection__KeyRingPath
              value: /media/keyring
            - name: Publish__PublicMediaBaseUrl
              value: https://ns3098488.ip-54-36-172.eu
            - name: Publish__DefaultPrivacy
              value: private
            - name: OneDrive__TenantId
              value: consumers
            - name: Smtp__Port
              value: "587"
            - name: Smtp__UseStartTls
              value: "true"
          envFrom:
            - secretRef:
                name: aurastream-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5075
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: aurastream-media
