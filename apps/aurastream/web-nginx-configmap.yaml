apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: aurastream
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 200m;

        # kube-dns (k3s CoreDNS) — Docker's 127.0.0.11 does not exist here.
        resolver 10.43.0.10 valid=10s;

        location /api/ {
            set $upstream_api http://api.aurastream.svc.cluster.local:5075;
            proxy_pass $upstream_api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hangfire {
            set $upstream_hangfire http://api.aurastream.svc.cluster.local:5075;
            proxy_pass $upstream_hangfire$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Publish media Buffer fetches at post-publish time. Unauthenticated by
        # design: unguessable GUID filename is the capability. No autoindex.
        location /pub-media/ {
            alias /pubmedia/;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
