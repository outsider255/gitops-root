apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: aurastream
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aurastream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/outsider255/aurastream-web:a6a370d8d448dbff6070c981557c121b134c1a7a
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            # subPath scopes the mount to the public folder only — nginx must never
            # see the rest of the media PVC (the Data Protection keyring lives there).
            - name: pubmedia
              mountPath: /pubmedia
              subPath: publish-public
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx
        - name: pubmedia
          persistentVolumeClaim:
            claimName: aurastream-media
