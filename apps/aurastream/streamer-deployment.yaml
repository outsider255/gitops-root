apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamer
  namespace: aurastream
spec:
  replicas: 1
  strategy:
    type: Recreate   # single ffmpeg push; never two streamers at once
  selector:
    matchLabels:
      app: streamer
  template:
    metadata:
      labels:
        app: streamer
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: streamer
          image: ghcr.io/outsider255/aurastream-streamer:15ba4c437df97c9caaae99b9d735b8b5ce8d5a48
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: DataProtection__KeyRingPath
              value: /media/keyring
          envFrom:
            - secretRef:
                name: aurastream-secrets    # ConnectionStrings__Default, R2__*
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true                # key ring only; RWO shared same-node on single-node k3s
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: aurastream-media
