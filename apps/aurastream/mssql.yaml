apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: aurastream
spec:
  clusterIP: None
  selector:
    app: mssql
  ports:
    - port: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: aurastream
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aurastream-secrets
                  key: MSSQL_SA_PASSWORD
          ports:
            - containerPort: 1433
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
