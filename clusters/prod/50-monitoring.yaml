apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "87.2.1"
    helm:
      valuesObject:
        # K3s does not expose these control-plane scrape endpoints
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi

        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          grafana.ini:
            server:
              root_url: "https://grafana.stocznia.dev"
          persistence:
            enabled: true
            storageClassName: local-path
            size: 2Gi
          # ClusterIP only: reached through Traefik at grafana.stocznia.dev (TLS + rate limit).
          # It was a NodePort (30300), which published the login page over plain HTTP on the
          # box's public IP, bypassing both.
          service:
            type: ClusterIP

        alertmanager:
          # Notifications go to an ntfy topic (phone push). The topic URL is a secret — anyone
          # who knows it can read the alerts — so it lives in the hand-made Secret
          # `alertmanager-ntfy` (key `url`, value https://ntfy.sh/<topic>?template=alertmanager)
          # and is read with url_file. Create that Secret BEFORE syncing this: the pod mounts it.
          # The URL also carries the notification templates (short title, affected objects, a
          # hint): edit tools/alertmanager-ntfy/*.tmpl, preview, then write the Secret with
          # tools/alertmanager-ntfy/apply.ps1 -Topic <topic>.
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: ntfy
              group_by: [namespace, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                - receiver: "null"
                  matchers: ['alertname=~"Watchdog|InfoInhibitor"']
                - receiver: "null"
                  matchers: ['severity=~"info|none"']
            inhibit_rules:
              - source_matchers: ['severity="critical"']
                target_matchers: ['severity=~"warning|info"']
                equal: [namespace, alertname]
              - source_matchers: ['severity="warning"']
                target_matchers: ['severity="info"']
                equal: [namespace, alertname]
              - source_matchers: ['alertname="InfoInhibitor"']
                target_matchers: ['severity="info"']
                equal: [namespace]
            receivers:
              - name: "null"
              - name: ntfy
                webhook_configs:
                  - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
                    send_resolved: true
                    # ntfy rejects a templated message over ~4 KB (HTTP 400 "too large after
                    # replacing template"); one alert renders to ~450 chars, so 13 grouped
                    # KubeJobFailed alerts failed. 5 leaves margin for longer labels.
                    max_alerts: 5
                    timeout: 10s
          alertmanagerSpec:
            secrets:
              - alertmanager-ntfy
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
