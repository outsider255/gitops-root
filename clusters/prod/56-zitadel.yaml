apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zitadel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: zitadel
  sources:
    - repoURL: https://charts.zitadel.com
      chart: zitadel
      targetRevision: "10.0.4"
      helm:
        releaseName: zitadel
        valueFiles:
          - $values/apps/zitadel/values.yaml
    - repoURL: https://github.com/outsider255/gitops-root.git
      targetRevision: main
      ref: values
      path: apps/zitadel
      directory:
        exclude: values.yaml
  # The API server stamps apiVersion, kind and status into each live
  # volumeClaimTemplate. They are not expressible in the desired manifest, so
  # without this the Application is permanently OutOfSync and the status stops
  # being a usable drift signal.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: zitadel-postgres
      namespace: zitadel
      jsonPointers:
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
        - /spec/volumeClaimTemplates/0/status
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
